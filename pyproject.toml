[project]
name = "urna-aberta"
version = "0.1.0"
description = "ELT de dados abertos eleitorais do TSE para o Databricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.157.0",
    "databricks-sql-connector>=4.8.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "detect-secrets",
    "respx>=0.23.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urna_aberta"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
