contract_version: 1
family: motivo_cassacao
ckan_dataset: candidatos-2026
zip:
- https://cdn.tse.jus.br/estatistica/sead/odsele/motivo_cassacao/motivo_cassacao_2026.zip
member_pattern: motivo_cassacao_2026_{UF}.csv
format:
  encoding: iso-8859-1
  bom: false
  delimiter: ;
  quotechar: '"'
  quoting: header e colunas de texto entre aspas; colunas numericas sem aspas
  line_terminator: CRLF
columns:
- name: DT_GERACAO
  type: date_dmy
- name: HH_GERACAO
  type: time
- name: ANO_ELEICAO
  type: int
- name: CD_TIPO_ELEICAO
  type: int
- name: NM_TIPO_ELEICAO
  type: str
- name: CD_ELEICAO
  type: int
- name: DS_ELEICAO
  type: str
- name: SG_UF
  type: str
- name: SG_UE
  type: str
- name: NM_UE
  type: str
- name: SQ_CANDIDATO
  type: int
- name: NR_PROCESSO
  type: int
  special:
  - '-1'
- name: DS_TP_MOTIVO
  type: str
- name: DS_MOTIVO
  type: str
