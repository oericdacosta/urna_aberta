contract_version: 1
family: perfil_eleitor_deficiencia
ckan_dataset: eleitorado-2026
zip:
- https://cdn.tse.jus.br/estatistica/sead/odsele/perfil_eleitor_deficiente/perfil_eleitor_deficiencia_2026.zip
member_pattern: perfil_eleitor_deficiencia_2026_{UF}.csv
format:
  encoding: iso-8859-1
  bom: false
  delimiter: ;
  quotechar: '"'
  quoting: header e colunas de texto entre aspas; colunas numericas sem aspas
  line_terminator: CRLF
columns:
- name: DT_GERACAO
  type: date_dmy
- name: HH_GERACAO
  type: time
- name: AA_ELEICAO
  type: int
- name: SQ_ELEITOR
  type: int
- name: SG_UF
  type: str
- name: CD_MUNICIPIO
  type: str
  zero_padded: true
- name: NM_MUNICIPIO
  type: str
- name: CD_MUN_SITU_BIOMETRICA
  type: int
- name: DS_MUN_SITU_BIOMETRICA
  type: str
- name: NR_ZONA
  type: int
- name: NR_SECAO
  type: int
- name: CD_GENERO
  type: int
- name: DS_GENERO
  type: str
- name: CD_ESTADO_CIVIL
  type: int
- name: DS_ESTADO_CIVIL
  type: str
- name: CD_FAIXA_ETARIA
  type: int
  special:
  - '-3'
- name: DS_FAIXA_ETARIA
  type: str
- name: CD_GRAU_ESCOLARIDADE
  type: int
- name: DS_GRAU_ESCOLARIDADE
  type: str
- name: CD_TIPO_DEFICIENCIA
  type: int
- name: DS_TIPO_DEFICIENCIA
  type: str
- name: ST_ELEITOR_BIOMETRIA
  type: str
- name: CD_RACA_COR
  type: int
  special:
  - '-1'
- name: DS_RACA_COR
  type: str
- name: CD_IDENTIDADE_GENERO
  type: int
  special:
  - '-1'
- name: DS_IDENTIDADE_GENERO
  type: str
- name: CD_QUILOMBOLA
  type: int
  special:
  - '-1'
- name: DS_QUILOMBOLA
  type: str
- name: CD_INTERPRETE_LIBRAS
  type: int
  special:
  - '-1'
- name: DS_INTERPRETE_LIBRAS
  type: str
