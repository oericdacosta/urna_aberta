contract_version: 1
family: votacao_secao
ckan_dataset: resultados-2026
zip:
- https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_2026_{UF}.zip
member_pattern: votacao_secao_2026_{UF}.csv
format:
  encoding: iso-8859-1
  bom: false
  delimiter: ;
  quotechar: '"'
  quoting: header e colunas de texto entre aspas; colunas numericas sem aspas
  line_terminator: CRLF
columns:
- name: DT_GERACAO
  type: date_dmy
- name: HH_GERACAO
  type: time
- name: ANO_ELEICAO
  type: int
- name: CD_TIPO_ELEICAO
  type: int
- name: NM_TIPO_ELEICAO
  type: str
- name: NR_TURNO
  type: int
- name: CD_ELEICAO
  type: int
- name: DS_ELEICAO
  type: str
- name: DT_ELEICAO
  type: date_dmy
- name: TP_ABRANGENCIA
  type: str
- name: SG_UF
  type: str
- name: SG_UE
  type: str
- name: NM_UE
  type: str
- name: CD_MUNICIPIO
  type: int
- name: NM_MUNICIPIO
  type: str
- name: NR_ZONA
  type: int
- name: NR_SECAO
  type: int
- name: CD_CARGO
  type: int
- name: DS_CARGO
  type: str
- name: NR_VOTAVEL
  type: int
- name: NM_VOTAVEL
  type: str
- name: QT_VOTOS
  type: int
- name: NR_LOCAL_VOTACAO
  type: int
- name: SQ_CANDIDATO
  type: int
  special:
  - '-1'
  - '-3'
- name: NM_LOCAL_VOTACAO
  type: str
- name: DS_LOCAL_VOTACAO_ENDERECO
  type: str
