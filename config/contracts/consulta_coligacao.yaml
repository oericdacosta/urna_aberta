  - '#NULO'
- name: DS_COMPOSICAO_COLIGACAO
  type: str
- name: CD_SITUACAO_LEGENDA
  type: str
- name: DS_SITUACAO
  type: str
- name: NM_TIPO_DESTINACAO_VOTOS
  type: str
  special:
  - '#NE'
