- name: NR_TURNO
  type: int
- name: CD_ELEICAO
  type: int
- name: DS_ELEICAO
  type: str
- name: DT_ELEICAO
  type: date_dmy
- name: SG_UF
  type: str
- name: SG_UE
  type: str
- name: NM_UE
  type: str
- name: CD_CARGO
  type: int
- name: DS_CARGO
  type: str
- name: TP_AGREMIACAO
  type: str
- name: NR_PARTIDO
  type: int
- name: SG_PARTIDO
  type: str
- name: NM_PARTIDO
  type: str
- name: NR_FEDERACAO
  type: int
  special:
  - '-1'
- name: NM_FEDERACAO
  type: str
